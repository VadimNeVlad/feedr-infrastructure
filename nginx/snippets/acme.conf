# server context: Let's Encrypt HTTP-01 challenge.
# certbot on the host writes tokens to /opt/feedr/acme (mounted here read-only);
# Let's Encrypt fetches them over plain HTTP on port 80 — this location must never redirect.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
}
