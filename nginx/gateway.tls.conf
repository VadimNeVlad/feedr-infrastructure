# Production gateway with TLS (VPS). Selected by GATEWAY_CONF=gateway.tls.conf in .env.
# Requires certs/fullchain.pem and certs/privkey.pem — copied there by the certbot deploy hook
# (scripts/certbot-deploy-hook.sh). nginx refuses to start without them.

include /etc/nginx/snippets/upstreams.conf;

# Host port 80 -> 8080: only the healthcheck, ACME challenges and a redirect to HTTPS.
server {
    listen 8080 default_server;
    server_name _;

    access_log /dev/stdout gateway;

    include /etc/nginx/snippets/healthz.conf;
    include /etc/nginx/snippets/acme.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

# Host port 443 -> 8443: the application over TLS.
server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;

    access_log /dev/stdout gateway;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Mozilla "Intermediate" profile (TLS 1.2 + 1.3), without DHE suites (no dhparam file needed).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # No OCSP stapling: Let's Encrypt ended OCSP in 2025.

    # Start small; raise to max-age=31536000 once HTTPS has been stable for a while.
    # A long max-age with broken TLS locks visitors out until it expires. No `preload`.
    add_header Strict-Transport-Security "max-age=300" always;

    include /etc/nginx/snippets/app.conf;
}
