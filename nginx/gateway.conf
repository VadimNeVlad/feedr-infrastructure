# Single entry point: /api/ -> backend, everything else -> frontend.
# Mounted into nginx-unprivileged as /etc/nginx/conf.d/default.conf (http context).

# Docker's embedded DNS: re-resolve service names so a recreated container
# (new IP) is picked up without restarting the gateway.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend {
    zone backend 64k;
    server backend:3000 resolve;
    keepalive 16;
}

upstream frontend {
    zone frontend 64k;
    server frontend:8080 resolve;
    keepalive 16;
}

log_format gateway '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" rid=$request_id '
                   'rt=$request_time urt=$upstream_response_time';

server {
    listen 8080;
    server_name _;

    server_tokens off;
    access_log /dev/stdout gateway;

    # Covers JSON from the API; frontend assets arrive already compressed.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json text/plain;

    # Security headers for every response, set here once. `always` keeps them on 4xx/5xx.
    # Strict-Transport-Security goes here once TLS is terminated on the gateway.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Google Fonts: Roboto is loaded from index.html. 'unsafe-inline' styles are required by MUI (emotion).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://res.cloudinary.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Gateway's own probe; does not depend on upstreams.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # Images are capped at 4 MB by the backend; leave room for multipart overhead.
        client_max_body_size 5m;

        # helmet sets these too; the gateway is the single source.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Powered-By;

        proxy_pass http://backend;
    }

    location / {
        # Cache-Control from the frontend (immutable assets, no-cache index.html) passes through.
        proxy_pass http://frontend;
    }
}
