# Plain HTTP gateway: local runs and the TLS bootstrap on the VPS (first certificate).
# Mounted into nginx-unprivileged as /etc/nginx/conf.d/default.conf (http context).
# Production with TLS: gateway.tls.conf (selected by GATEWAY_CONF in .env).

include /etc/nginx/snippets/upstreams.conf;

server {
    listen 8080 default_server;
    server_name _;

    access_log /dev/stdout gateway;

    include /etc/nginx/snippets/healthz.conf;
    include /etc/nginx/snippets/acme.conf;
    include /etc/nginx/snippets/app.conf;
}
