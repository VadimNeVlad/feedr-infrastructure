name: feedr-prod

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    <<: *defaults
    image: postgres:18-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - postgres-prod-data:/var/lib/postgresql
    networks:
      - data
    stop_grace_period: 30s
    shm_size: 256mb
  
  migrate:
    <<: *defaults
    build:
      context: ../feedr-backend
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    networks:
      - data
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
  
  backend:
    <<: *defaults
    image: feedr-prod-backend
    build:
      context: ../feedr-backend
      target: prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CLOUD_NAME: ${CLOUD_NAME:?set CLOUD_NAME in .env}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?set CLOUDINARY_API_KEY in .env}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?set CLOUDINARY_API_SECRET in .env}
      TRUST_PROXY: "1"
      PORT: "3000"
    init: true
    networks:
      - edge
      - data
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    <<: *defaults
    image: feedr-prod-frontend
    build:
      context: ../feedr-frontend
      target: prod
    networks:
      - edge
  
  gateway:
    <<: *defaults
    image: nginxinc/nginx-unprivileged:alpine@sha256:26b0bf6fbf07297983cb341998d79c831508787de26627dd2a112321b9c3a4af
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - edge
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

networks:
  data:
    internal: true
  edge:

volumes:
  postgres-prod-data: