# terraform-docs: generated reference (requirements, inputs, outputs) in each module's README,
# between the BEGIN_TF_DOCS / END_TF_DOCS markers. The prose above the markers is written by hand.
formatter: markdown table

output:
  file: README.md
  mode: inject

sort:
  enabled: true
  by: required

settings:
  anchor: false
  hide-empty: true
  # Don't read .terraform.lock.hcl: in a module directory it is local and git-ignored
  # (left by `terraform test`), so the README would differ between machines and CI.
  lockfile: false
